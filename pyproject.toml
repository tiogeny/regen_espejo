[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "derma-onedge"
version = "0.1.0"
description = "Sistema Embebido de Diagnóstico Dermatoscópico Facial y Recomendación Fitoterapéutica (SPEC-001)"
readme = "spec/Spec.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.17.0",
    "onnx>=1.14.0",
    "opencv-python>=4.9.0",
    "mediapipe>=1.0.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]
windows = [
    "pygrabber>=0.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --strict-markers"
